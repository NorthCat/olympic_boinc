schema: spec-driven

context: |
  Project: Olympic BOINC — a backend that once a day collects completed (Completed)
  team challenges from BoincStats (project challenges: /stats/pchallenge/team/overview,
  team challenges: /stats/challenge/team/overview) and builds Olympic-style medal
  standings (gold/silver/bronze for 1st/2nd/3rd place).
  Tech stack: Python 3.13 (uv, .python-version, uv.lock; environment through UV_PROJECT_ENVIRONMENT or .venv), FastAPI, REST,
  PostgreSQL 18, SQLAlchemy 2 (async) + Alembic, pytest.
  BoincStats is protected by Cloudflare: regular HTTP clients receive 403.
  A team is identified by its name exactly as shown by BoincStats (without normalization); the place is taken from the BoincStats page (ties are allowed).
  Write artifacts in English; use the keywords SHALL/MUST in requirements.

