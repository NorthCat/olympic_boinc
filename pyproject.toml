[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olympic-boinc"
version = "0.1.0"
description = "Olympic-style medal standings for BOINC team challenges from BoincStats"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "nodriver",
    "tenacity",
    "opencv-python-headless",  # nodriver Tab.verify_cf
    "selectolax",
    "apscheduler>=3.11,<4",
    "elastic-apm>=6.26.2,<7",
]

[project.optional-dependencies]
load = ["locust>=2.43,<3"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "asgi-lifespan",
    "testcontainers[postgres]",
    "ruff",
    "mypy",
]
security = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olympic_boinc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real BoincStats site; run explicitly with `pytest -m live`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents", ".codex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "migrations", "scripts", "load_tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "nodriver.*",
    "apscheduler.triggers.cron.*",
    "apscheduler.schedulers.asyncio.*",
    "gevent.pywsgi.*",
]
ignore_missing_imports = true
