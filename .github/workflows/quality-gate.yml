name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: olympic_ci
          POSTGRES_PASSWORD: olympic_ci
          POSTGRES_DB: olympic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympic_ci -d olympic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      OLYMPIC_TEST_DATABASE_URL: postgresql+asyncpg://olympic_ci:olympic_ci@localhost:5432/olympic_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project Python
        run: uv python install

      - name: Install Semgrep separately
        run: |
          uv tool install semgrep
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Run quality gate
        run: ./quality-gate.sh
